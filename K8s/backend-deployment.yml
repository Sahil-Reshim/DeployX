apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-backend
  namespace: deployx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-backend

  template:
    metadata:
      labels:
        app: deployx-backend

    spec:
      containers:
        - name: deployx-backend
          image: tanvishinde017/deployx-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: FLASK_ENV
              value: "production"

          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket