apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployx-backend
  namespace: deployx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deployx-backend

  template:
    metadata:
      labels:
        app: deployx-backend

    spec:
      serviceAccountName: deployx-backend
      containers:
        - name: deployx-backend
          image: tanvishinde017/deployx-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: FLASK_ENV
              value: "production"

            # Jenkins runs as a Kubernetes ClusterIP service in the
            # `deployx` namespace. The backend reaches it via the service
            # DNS name `jenkins:8080` (NOT localhost).
            - name: JENKINS_URL
              value: "http://jenkins:8080"
            - name: JENKINS_USER
              value: "admin"
            - name: JENKINS_API_TOKEN
              value: "admin123"
            - name: JENKINS_JOB_NAME
              value: "flask-docker-build"

          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket