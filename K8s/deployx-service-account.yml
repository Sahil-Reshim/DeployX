---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deployx-backend
  namespace: deployx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployx-app-manager
  namespace: deployx
rules:
  - apiGroups: ["apps"]
    resources: ["deployments","deployments/scale","deployments/status"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["pods","pods/log","services","configmaps","secrets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods","pods/metrics","nodes","nodes/metrics"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployx-backend-binding
  namespace: deployx
subjects:
  - kind: ServiceAccount
    name: deployx-backend
    namespace: deployx
roleRef:
  kind: Role
  name: deployx-app-manager
  apiGroup: rbac.authorization.k8s.io