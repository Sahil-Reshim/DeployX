apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: deployx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports:
            - containerPort: 27017

          env:
            - name: MONGO_INITDB_DATABASE
              value: deployx

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/db

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc

