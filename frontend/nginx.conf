# DeployX frontend — Nginx SPA config
# ---------------------------------------------------------------
# This server runs INSIDE the cluster behind the NGINX Ingress.
# The Ingress routes /api/* and /socket.io/* straight to the
# backend (deployx-backend:5000), so this server is ONLY responsible
# for serving the React single-page application built by Vite.
#
# `try_files ... /index.html` provides the SPA fallback so that
# client-side routes (/dashboard, etc.) served by react-router
# (BrowserRouter) resolve to the app instead of a 404 on refresh
# or direct access.
# ---------------------------------------------------------------
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip for smaller transfers
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/javascript;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames under /assets/ — cache them hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: unknown paths fall through to index.html so
    # react-router can mount the matching route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML — stale HTML references old hashed
    # assets, which breaks the app after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
